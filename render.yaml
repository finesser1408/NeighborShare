services:
  - type: web
    name: neighbourshare-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate
    startCommand: gunicorn neighbourshare.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: USE_SQLITE
        value: "False"
      - key: POSTGRES_DB
        fromDatabase:
          name: neighbourshare-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: neighbourshare-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: neighbourshare-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: neighbourshare-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: neighbourshare-db
          property: port
      - key: REDIS_URL
        fromService:
          type: redis
          name: neighbourshare-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://neighbourshare-frontend-7j6c.onrender.com
      - key: SITE_URL
        value: https://neighbourshare-backend-7j6c.onrender.com
      - key: NOMINATIM_USER_AGENT
        value: NeighbourShare/1.0

  - type: web
    name: neighbourshare-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: VITE_API_URL
        value: https://neighbourshare-backend-7j6c.onrender.com/api

  - type: redis
    name: neighbourshare-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere

databases:
  - name: neighbourshare-db
    databaseName: neighbourshare
    user: neighbourshare
    plan: free
    region: oregon
