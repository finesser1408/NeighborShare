version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: neighbourshare_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neighbourshare}
      POSTGRES_USER: ${POSTGRES_USER:-neighbourshare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neighbourshare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neighbourshare} -d ${POSTGRES_DB:-neighbourshare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: neighbourshare_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neighbourshare_api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-neighbourshare}
      - POSTGRES_USER=${POSTGRES_USER:-neighbourshare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neighbourshare}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ECOCASH_API_URL=${ECOCASH_API_URL:-https://sandbox.ecocash.co.zw/api/v2}
      - ECOCASH_MERCHANT_ID=${ECOCASH_MERCHANT_ID}
      - ECOCASH_API_KEY=${ECOCASH_API_KEY}
      - ECOCASH_WALLET_LIMIT=${ECOCASH_WALLET_LIMIT:-50000}
      - NOMINATIM_USER_AGENT=NeighbourShare/1.0
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neighbourshare_celery
    command: celery -A neighbourshare worker -l info -Q default,escrow,disputes,qr
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-neighbourshare}
      - POSTGRES_USER=${POSTGRES_USER:-neighbourshare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neighbourshare}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - ECOCASH_API_URL=${ECOCASH_API_URL:-https://sandbox.ecocash.co.zw/api/v2}
      - ECOCASH_MERCHANT_ID=${ECOCASH_MERCHANT_ID}
      - ECOCASH_API_KEY=${ECOCASH_API_KEY}
      - ECOCASH_WALLET_LIMIT=${ECOCASH_WALLET_LIMIT:-50000}
      - NOMINATIM_USER_AGENT=NeighbourShare/1.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neighbourshare_celery_beat
    command: celery -A neighbourshare beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - POSTGRES_DB=${POSTGRES_DB:-neighbourshare}
      - POSTGRES_USER=${POSTGRES_USER:-neighbourshare}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-neighbourshare}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neighbourshare_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - REACT_APP_NOMINATIM_URL=https://nominatim.openstreetmap.org

  nginx:
    image: nginx:alpine
    container_name: neighbourshare_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/var/www/static
      - media_volume:/var/www/media
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: